services:
  api:
    build: .
    container_name: agregamigos-api
    env_file:
      - .env
    ports:
      # Hostinger host port (evita conflito com base-api:3000 e escala-agro-api:4001)
      - "4002:3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:12.3
    container_name: agregamigos-postgres
    environment:
      POSTGRES_DB: agregamigos
      POSTGRES_USER: agregamigos
      POSTGRES_PASSWORD: initial123
    ports:
      - "5457:5432"
    volumes:
      - agregamigos-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agregamigos-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  agregamigos-postgres-data:

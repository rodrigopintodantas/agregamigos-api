# Colar dentro do `server { }` ou do `location` que faz proxy_pass para esta API (Node/Express).
# O nginx recusa corpos maiores que 1 MB por defeito → 413 Request Entity Too Large em CSV grande.
# O Express já aceita ~200 MB em /api/ouvidoria/importar-csv; o frontend envia em lotes pequenos,
# mas convém alinhar o proxy para outras rotas ou envios únicos.
client_max_body_size 250m;

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    user: node
    environment:
      - NODE_ENV=stage
      - DOCKER_CONTAINER=true
    volumes:
      - ..:/workspaces:cached
    ports:
      - "3000:3000"
    command: /bin/sh -c "while sleep 1000; do :; done"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:12.3
    restart: "no"
    environment:
      - POSTGRES_DB=agregamigos
      - POSTGRES_USER=agregamigos
      - POSTGRES_PASSWORD=initial123
    ports:
      - "5457:5432"
    volumes:
      - agregamigos-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: "no"
    ports:
      - "6380:6379"

volumes:
  agregamigos-postgres-data:
    driver: local
